<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V2DEY</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0d0d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    .card {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 30px 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.4);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    p {
      color: #bdbdbd;
      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #229ed9;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    #contactPage {
      display: none;
    }

    .back {
      background: #292929;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- صفحه اصلی -->
    <div class="card" id="homePage">
      <div class="icon">💬</div>

      <h2>پشتیبانی V2DEY</h2>

      <p>
        برای ارتباط با ادمین و دریافت پشتیبانی،
        روی دکمه زیر کلیک کنید.
      </p>

      <button onclick="showContact()">
        ارتباط با ادمین
      </button>
    </div>


    <!-- صفحه ارتباط -->
    <div class="card" id="contactPage">
      <div class="icon">👨🏻‍💻</div>

      <h2>ارتباط با ادمین</h2>

      <p>
        برای ارتباط مستقیم با ادمین،
        روی دکمه زیر کلیک کنید.
      </p>

      <button onclick="openTelegram()">
        🔵 ورود به پی‌وی ادمین
      </button>

      <button class="back" onclick="goBack()">
        بازگشت
      </button>
    </div>

  </div>


  <script>
    function showContact() {
      document.getElementById("homePage").style.display = "none";
      document.getElementById("contactPage").style.display = "block";
    }

    function goBack() {
      document.getElementById("contactPage").style.display = "none";
      document.getElementById("homePage").style.display = "block";
    }

    function openTelegram() {
      window.location.href = "https://t.me/wl52hz";
    }
  </script>

</body>
</html>
