<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>V2DEY VPN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at top, rgba(150, 0, 0, 0.18), transparent 40%),
        #050505;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom))
        20px;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(
        145deg,
        rgba(25, 25, 25, 0.96),
        rgba(8, 8, 8, 0.98)
      );
      border: 1px solid rgba(255, 0, 0, 0.22);
      border-radius: 25px;
      padding: 32px 24px 26px;
      text-align: center;
      box-shadow:
        0 0 35px rgba(180, 0, 0, 0.14),
        inset 0 0 25px rgba(255, 0, 0, 0.025);
    }

    .icon-box {
      width: 105px;
      height: 105px;
      margin: 0 auto 12px;
      border-radius: 28px;

      background:
        linear-gradient(145deg, #171717, #050505);

      border: 1px solid rgba(255, 0, 0, 0.45);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 58px;

      box-shadow:
        0 0 25px rgba(255, 0, 0, 0.22),
        inset 0 0 18px rgba(255, 0, 0, 0.08);

      position: relative;
    }

    .icon-box::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      background: #ff0000;
      border-radius: 50%;
      top: 13px;
      right: 15px;
      box-shadow: 0 0 12px #ff0000;
    }

    .brand {
      color: #ff1a1a;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 22px;
      text-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .description {
      color: #bdbdbd;
      font-size: 14px;
      line-height: 2;
      margin-bottom: 25px;
    }

    .admin-button {
      width: 100%;
      min-height: 58px;

      border: 1px solid rgba(255, 0, 0, 0.45);
      border-radius: 17px;

      background:
        linear-gradient(
          105deg,
          #050505 0%,
          #080808 38%,
          #160000 63%,
          #b00000 100%
        );

      color: white;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.5),
        0 0 18px rgba(180, 0, 0, 0.18);

      transition: 0.2s ease;
    }

    .admin-button:active {
      transform: scale(0.97);
    }

    .note {
      margin-top: 18px;
      padding: 13px 14px;

      background: rgba(255, 0, 0, 0.045);
      border: 1px solid rgba(255, 0, 0, 0.13);
      border-radius: 14px;

      color: #a9a9a9;
      font-size: 11.5px;
      line-height: 1.9;
    }

    .note::first-letter {
      color: #ff1a1a;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="icon-box">
      👨🏻‍💻
    </div>

    <div class="brand">
      V2DEY VPN
    </div>

    <h1>
      ارتباط با ادمین
    </h1>

    <div class="description">
      برای ارتباط مستقیم با ادمین و دریافت پشتیبانی،
      روی دکمه زیر کلیک کنید.
    </div>

    <button class="admin-button" onclick="openAdmin()">
      🔴اتصال به پیوی ادمین 🔴
    </button>

    <div class="note">
      ⚠️ نکته: قبل از ارتباط با پشتیبانی، در صورت متصل نشدن کانفیگ،
      اپلیکیشن‌های دیگر را نیز امتحان کنید و از وضعیت اتصال اینترنت خود
      اطمینان حاصل کنید.
    </div>

  </div>

  <script>
    function openAdmin() {
      window.location.href = "https://t.me/wl52hz";
    }
  </script>

</body>
</html>
