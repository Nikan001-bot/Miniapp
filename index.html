<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V2DEY</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0b0b;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 18px;
      margin: 14px 0;
      border: 0;
      border-radius: 15px;
      background: #1c1c1c;
      color: white;
      font-size: 17px;
      text-align: center;
    }

    .button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <h1>🌐 V2DEY</h1>

  <div class="subtitle">
    پنل کاربری
  </div>

  <div class="button">📦 سرویس‌های من</div>

  <div class="button">🎫 پشتیبانی</div>

  <div class="button">🛒 خرید سرویس</div>

</html>
