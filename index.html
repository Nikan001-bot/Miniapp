<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>V2DEY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 0%, #202020 0%, #0c0c0c 48%, #050505 100%);
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        calc(20px + env(safe-area-inset-top))
        20px
        calc(20px + env(safe-area-inset-bottom))
        20px;

      overflow: hidden;
    }

    .glow {
      position: fixed;
      width: 240px;
      height: 240px;
      background: rgba(34, 158, 217, 0.12);
      filter: blur(80px);
      border-radius: 50%;
      top: -80px;
      right: -70px;
      pointer-events: none;
    }

    .glow2 {
      position: fixed;
      width: 220px;
      height: 220px;
      background: rgba(34, 158, 217, 0.08);
      filter: blur(80px);
      border-radius: 50%;
      bottom: -80px;
      left: -70px;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 390px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .card {
      width: 100%;
      background: rgba(23, 23, 23, 0.94);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 26px;
      padding: 36px 24px 30px;
      text-align: center;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;

      border-radius: 22px;
      background: linear-gradient(145deg, #222, #101010);

      border: 1px solid rgba(255,255,255,0.08);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
    }

    .brand {
      color: #229ed9;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 13px;
    }

    p {
      color: #aaa;
      font-size: 14px;
      line-height: 2;
      margin-bottom: 25px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 54px;

      border: none;
      border-radius: 15px;

      background: linear-gradient(135deg, #229ed9, #168ac1);

      color: white;
      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 10px 25px rgba(34,158,217,0.22);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 18px;
      color: #555;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="container">

    <div class="card">

      <div class="logo">
        👨🏻‍💻
      </div>

      <div class="brand">
        V2DEY
      </div>

      <h2>
        ارتباط با ادمین
      </h2>

      <p>
        برای ارتباط مستقیم با ادمین و دریافت پشتیبانی،
        روی دکمه زیر کلیک کنید.
      </p>

      <button class="btn" onclick="openTelegram()">
        🔵 ورود به پی‌وی ادمین
      </button>

      <div class="footer">
        پشتیبانی V2DEY
      </div>

    </div>

  </div>

  <script>
    function openTelegram() {
      window.location.href = "https://t.me/wl52hz";
    }
  </script>

</body>
</html>
