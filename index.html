<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V2DEY</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 25px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
    }

    .support {
      background: #222;
      color: white;
    }

    #ticketBox {
      display: none;
      margin-top: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .send {
      background: #0088cc;
      color: white;
    }
  </style>
</head>

<body>

  <h1>V2DEY</h1>

  <button class="support" onclick="openTicket()">
    🎫 پشتیبانی
  </button>

  <div id="ticketBox">

    <h3>ارسال تیکت</h3>

    <textarea
      id="message"
      placeholder="مشکل یا پیام خود را بنویسید..."
    ></textarea>

    <button class="send" onclick="sendTicket()">
      📩 ارسال تیکت
    </button>

  </div>

  <script>

    const tg = window.Telegram.WebApp;

    tg.expand();

    function openTicket() {
      document.getElementById("ticketBox").style.display = "block";
    }

    function sendTicket() {

      const message = document.getElementById("message").value.trim();

      if (!message) {
        tg.showAlert("لطفاً پیام خود را بنویسید.");
        return;
      }

      const data = {
        type: "ticket",
        message: message
      };

      tg.sendData(JSON.stringify(data));

    }

  </script>

</body>
</html>
